name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Smoke test the server
        run: |
          # Run the venv's entry point directly so $! is the server itself, send its output
          # to a file (a background process holding the step's pipes open stalls the job),
          # and always stop it so the post-job cache cleanup is not racing a live process.
          .venv/bin/jobtrail serve > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8000/health; then
              curl -fs http://127.0.0.1:8000/board > /dev/null && exit 0
              echo "health is up but /board failed" && exit 1
            fi
            sleep 1
          done
          echo "server did not come up:" && cat server.log && exit 1
