[project]
name = "jobtrail"
version = "0.1.0"
description = "Local-first job search tracker with funnel analytics and an optional local-LLM assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alvaro Verona" }]
keywords = ["job search", "tracker", "local-first", "ollama", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: End Users/Desktop",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings",
    "jinja2",
    "python-multipart",
    "ollama>=0.6.3",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[project.urls]
Repository = "https://github.com/AlvaroVerona/jobtrail"

[project.scripts]
jobtrail = "jobtrail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
